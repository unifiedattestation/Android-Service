plugins {
    id 'com.android.application'
}

android {
    namespace 'net.uattest.service'
    compileSdk 34

    def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def keyAliasValue = System.getenv("ANDROID_KEY_ALIAS")
    def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")

    if (keystorePath) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    defaultConfig {
        applicationId "net.uattest.service"
        minSdk 28
        targetSdk 34
        // versionCode = major*10000 + minor*100 + patch
        versionCode 10003
        versionName "1.0.3"

    }

    buildTypes {
        release {
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        aidl true
    }
    sourceSets {
        debug.manifest.srcFile 'src/gradleOnly/AndroidManifest.xml'
        release.manifest.srcFile 'src/gradleOnly/AndroidManifest.xml'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                def vName = variant.versionName ?: "0.0.0"
                outputFileName = "ua-android-service-${vName}.apk"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'net.uattest:android-sdk:0.1.0'
    // Provides org.bouncycastle.asn1.*, used by the vendored key-attestation extension
    // parser in net.uattest.service.keyattestation (see that package for why it's vendored
    // instead of depending on com.github.android:keyattestation).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
